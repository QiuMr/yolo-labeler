name: 构建并部署到 GitHub Pages

# 一、推到 main 就自动构建 + 发布，仓库里只存源码、不存产物
# 二、也可以在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：读仓库、写 Pages、拿 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；新的推送直接取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 静态检查与单元测试放在 build 之前：它们是纯函数级别的快速门槛，
      # 一旦挂了就没必要浪费时间去打包。失败即阻断部署，不会有坏产物上线。
      - name: 静态检查
        run: npm run lint

      - name: 单元测试
        run: npm run test:unit

      - name: 类型检查 + 打包
        run: npm run build

      # ⚠️ 下面这两步是有因果关系的，别删任何一个：
      #
      # configure-pages 的 enablement 只在**仓库尚未启用 Pages 时**创建站点。
      # 如果仓库早已是「从某个分支部署」，它会撞 409 然后静默跳过 —— **它不会切换来源**。
      # 而只要来源还是分支，GitHub 内置的 pages-build-deployment 就会在每次 push 后
      # 再部署一次**分支根目录**：那里只有源码 index.html、没有构建出来的 assets/，
      # 于是线上被覆盖成一个「标题能看见、脚本全部 404」的坏页面，
      # 而且它和我们这次部署谁后完成谁生效 —— 是间歇性的，极难排查。
      - name: 读取 Pages 配置
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 用一次 PUT 显式把来源改成 workflow，彻底停掉那条分支式部署。
      # 来源已经正确时这个请求是幂等的（PUT 全量覆盖，没有副作用）。
      - name: 确保 Pages 来源为 GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::切换前"
          gh api "repos/${{ github.repository }}/pages" --jq '{build_type, source}' || true
          echo "::endgroup::"
          gh api --method PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
          echo "::group::切换后"
          gh api "repos/${{ github.repository }}/pages" --jq '{build_type, source}'
          echo "::endgroup::"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发 dist/，源码和 node_modules 都不进产物
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
