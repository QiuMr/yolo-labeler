name: 构建并部署到 GitHub Pages

# 一、推到 main 就自动构建 + 发布，仓库里只存源码、不存产物
# 二、也可以在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：读仓库、写 Pages、拿 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；新的推送直接取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 静态检查与单元测试放在 build 之前：它们是纯函数级别的快速门槛，
      # 一旦挂了就没必要浪费时间去打包。失败即阻断部署，不会有坏产物上线。
      - name: 静态检查
        run: npm run lint

      - name: 单元测试
        run: npm run test:unit

      - name: 类型检查 + 打包
        run: npm run build

      # ⚠️ 背景：为什么非要把来源切成 workflow
      #
      # configure-pages 的 enablement 只在**仓库尚未启用 Pages 时**创建站点；
      # 仓库早已是「从某个分支部署」时它会撞 409 然后静默跳过 —— **它不会切换来源**。
      # 而只要来源还是分支，GitHub 内置的 pages-build-deployment 就会在每次 push 后
      # 再部署一次**分支根目录**：那里只有源码 index.html、没有构建出来的 assets/，
      # 于是线上被覆盖成「标题能看见、脚本全部 404」的坏页面，
      # 而且它和我们这次部署谁后完成谁生效 —— 间歇性，极难排查。
      - name: 读取 Pages 配置
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 只**探测**来源，不尝试自动切换 —— 因为自动切换在 Actions 里根本做不到：
      #
      # 修改 Pages 设置的端点是 `PUT /repos/{owner}/{repo}/pages`，
      # GitHub REST 文档要求它同时具备「Pages: write」**和**「Administration: write」。
      # 而 GITHUB_TOKEN 是仓库自带的临时令牌，**按设计就拿不到仓库管理权限**，
      # 无论 `permissions:` 里写什么都不行。所以那个 PUT 是 100% 会失败的
      # —— 之前那版真发过一次，果然失败，还把报错 `2>/dev/null` 掉了，
      #    连失败原因都没留下。留一个必然失败的网络请求只是噪音，删掉。
      #
      # 改成探测：来源不对就打一条 ::warning::，在 Actions 页面显眼但不染红流水线。
      # 流水线变红并不能让站点变好，只会训练你忽略红灯。
      # 来源正确时这一步完全静默。
      - name: 检查 Pages 来源是否为 GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUR=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "当前 Pages build_type = $CUR"
          if [ "$CUR" = "workflow" ]; then
            echo "来源正确，无需处理。"
            exit 0
          fi
          echo "::warning title=Pages 来源是 $CUR，需手动切换::请到仓库 Settings → Pages → Source 选择「GitHub Actions」。否则 GitHub 内置的分支式部署会在每次 push 后再部署一次分支根目录，把线上覆盖成「标题能看见、assets/*.js 全部 404」的坏页面，且与 Actions 部署谁后完成谁生效，表现为间歇性故障。"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发 dist/，源码和 node_modules 都不进产物
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
